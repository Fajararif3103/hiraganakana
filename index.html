<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uwicantik - Belajar Hiragana & Katakana</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: #0f1115; color: #f3f4f6; }
  .jp { font-family: 'Noto Sans JP', sans-serif; }
</style>
</head>
<body class="min-h-screen pb-12">
<div class="max-w-md mx-auto px-4 pt-6">
  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-rose-500 to-pink-600 flex items-center justify-center text-2xl font-bold jp shadow-lg">あ</div>
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-bold tracking-tight">KanaMaster</h1>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30">JP-ID</span>
      </div>
      <p class="text-xs text-gray-400">Belajar Hiragana & Katakana dari Nol</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="grid grid-cols-3 bg-[#181b21] p-1 rounded-xl border border-white/5 mb-5">
    <button onclick="setTab('table')" id="tab-table" class="py-2 text-xs font-semibold rounded-lg bg-rose-500 text-white transition">Tabel Kana</button>
    <button onclick="setTab('flash')" id="tab-flash" class="py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition">Flashcard</button>
    <button onclick="setTab('quiz')" id="tab-quiz" class="py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition">Kuis Latihan</button>
  </div>

  <!-- VIEW 1: TABEL KANA -->
  <div id="view-table">
    <div class="bg-[#181b21] p-3.5 rounded-2xl border border-white/5 mb-4">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button onclick="setType('hira')" id="btn-hira" class="py-2.5 px-3 rounded-xl text-xs font-semibold border border-rose-500/50 bg-rose-500/10 text-rose-300 transition">Hiragana (ひらがな)</button>
        <button onclick="setType('kata')" id="btn-kata" class="py-2.5 px-3 rounded-xl text-xs font-semibold border border-transparent bg-[#121418] text-gray-400 transition">Katakana (カタカナ)</button>
      </div>
      <label class="flex items-center gap-2.5 cursor-pointer select-none">
        <input type="checkbox" id="toggle-romaji" checked onchange="renderTable()" class="sr-only peer">
        <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:bg-rose-500 relative after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-4"></div>
        <span class="text-xs text-gray-300">Tampilkan Romaji</span>
      </label>
    </div>

    <div class="bg-[#181b21] p-3 rounded-2xl border border-white/5">
      <div class="grid grid-cols-5 gap-2 mb-2 text-center text-[11px] font-bold text-rose-400">
        <div class="bg-[#121418] py-1.5 rounded-lg">A</div>
        <div class="bg-[#121418] py-1.5 rounded-lg">I</div>
        <div class="bg-[#121418] py-1.5 rounded-lg">U</div>
        <div class="bg-[#121418] py-1.5 rounded-lg">E</div>
        <div class="bg-[#121418] py-1.5 rounded-lg">O</div>
      </div>
      <div id="kana-grid" class="grid grid-cols-5 gap-2"></div>
      <p class="text-[11px] text-gray-500 text-center mt-3">Ketuk huruf untuk mendengar pelafalan Jepang</p>
    </div>
  </div>

  <!-- VIEW 2: FLASHCARD -->
  <div id="view-flash" class="hidden">
    <div class="flex justify-between items-center mb-3">
      <select id="flash-filter" onchange="nextFlash()" class="bg-[#181b21] text-xs text-gray-200 border border-white/10 rounded-lg px-3 py-2 outline-none">
        <option value="all">Semua (Hiragana + Katakana)</option>
        <option value="hira">Hiragana Saja</option>
        <option value="kata">Katakana Saja</option>
      </select>
      <span id="flash-badge" class="text-[11px] px-2.5 py-1 rounded-full bg-white/5 text-gray-400">Hiragana</span>
    </div>
    <div onclick="flipCard()" class="bg-[#181b21] border border-white/10 rounded-3xl h-64 flex flex-col items-center justify-center cursor-pointer active:scale-95 transition p-6 text-center shadow-xl">
      <div id="fc-front" class="text-7xl font-bold jp text-white">あ</div>
      <div id="fc-back" class="hidden">
        <div id="fc-romaji" class="text-4xl font-bold text-rose-400 mb-2">a</div>
        <div id="fc-tip" class="text-xs text-gray-400">Dibaca seperti 'a' pada kata "apa"</div>
      </div>
      <p class="text-[11px] text-gray-500 mt-6">Ketuk kartu untuk membalik</p>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <button onclick="speakCurrent()" class="py-3 rounded-xl bg-[#181b21] border border-white/10 text-xs font-semibold hover:bg-white/5">🔊 Dengar Suara</button>
      <button onclick="nextFlash()" class="py-3 rounded-xl bg-rose-500 text-white text-xs font-semibold hover:bg-rose-600">Kartu Acak →</button>
    </div>
  </div>

  <!-- VIEW 3: KUIS -->
  <div id="view-quiz" class="hidden">
    <div class="flex justify-between items-center bg-[#181b21] px-4 py-3 rounded-xl border border-white/5 mb-4 text-xs">
      <span>Skor: <strong id="q-score" class="text-rose-400">0</strong></span>
      <span>Streak: <strong id="q-streak" class="text-amber-400">0 🔥</strong></span>
    </div>
    <div class="bg-[#181b21] border border-white/5 rounded-3xl p-6 text-center mb-4">
      <p id="q-label" class="text-xs text-gray-400 mb-2">Huruf apakah ini?</p>
      <div id="q-char" class="text-6xl font-bold jp my-4">あ</div>
      <p id="q-feedback" class="h-5 text-xs font-semibold"></p>
    </div>
    <div id="q-options" class="grid grid-cols-2 gap-2.5"></div>
  </div>
</div>

<script>
const KANA = [
  ['a','あ','ア'],['i','い','イ'],['u','う','ウ'],['e','え','エ'],['o','お','オ'],
  ['ka','か','カ'],['ki','き','キ'],['ku','く','ク'],['ke','け','ケ'],['ko','こ','コ'],
  ['sa','さ','サ'],['shi','し','シ'],['su','す','ス'],['se','せ','セ'],['so','そ','ソ'],
  ['ta','た','タ'],['chi','ち','チ'],['tsu','つ','ツ'],['te','て','テ'],['to','と','ト'],
  ['na','な','ナ'],['ni','に','ニ'],['nu','ぬ','ヌ'],['ne','ね','ネ'],['no','の','ノ'],
  ['ha','は','ハ'],['hi','ひ','ヒ'],['fu','ふ','フ'],['he','へ','ヘ'],['ho','ほ','ホ'],
  ['ma','ま','マ'],['mi','み','ミ'],['mu','む','ム'],['me','め','メ'],['mo','も','モ'],
  ['ya','や','ヤ'],['','',''],['yu','ゆ','ユ'],['','',''],['yo','よ','ヨ'],
  ['ra','ら','ラ'],['ri','り','リ'],['ru','る','ル'],['re','れ','レ'],['ro','ろ','ロ'],
  ['wa','わ','ワ'],['','',''],['','',''],['','',''],['wo','を','ヲ'],
  ['n','ん','ン'],['','',''],['','',''],['','',''],['','','']
];

let currentType = 'hira';
let fcItem = { r: 'a', c: 'あ', t: 'Hiragana' };
let fcFlipped = false;
let score = 0, streak = 0, qAnswer = '';

function speak(text) {
  if (!text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

function setTab(tab) {
  ['table','flash','quiz'].forEach(t => {
    document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
    const btn = document.getElementById('tab-' + t);
    btn.className = t === tab
      ? 'py-2 text-xs font-semibold rounded-lg bg-rose-500 text-white transition'
      : 'py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-white transition';
  });
  if (tab === 'flash') nextFlash();
  if (tab === 'quiz') nextQuiz();
}

function setType(type) {
  currentType = type;
  document.getElementById('btn-hira').className = type === 'hira'
    ? 'py-2.5 px-3 rounded-xl text-xs font-semibold border border-rose-500/50 bg-rose-500/10 text-rose-300 transition'
    : 'py-2.5 px-3 rounded-xl text-xs font-semibold border border-transparent bg-[#121418] text-gray-400 transition';
  document.getElementById('btn-kata').className = type === 'kata'
    ? 'py-2.5 px-3 rounded-xl text-xs font-semibold border border-rose-500/50 bg-rose-500/10 text-rose-300 transition'
    : 'py-2.5 px-3 rounded-xl text-xs font-semibold border border-transparent bg-[#121418] text-gray-400 transition';
  renderTable();
}

function renderTable() {
  const showRomaji = document.getElementById('toggle-romaji').checked;
  const grid = document.getElementById('kana-grid');
  grid.innerHTML = '';
  KANA.forEach(item => {
    const char = currentType === 'hira' ? item[1] : item[2];
    if (!char) {
      grid.innerHTML += '<div class="h-14 rounded-xl bg-[#121418]/40"></div>';
      return;
    }
    const card = document.createElement('button');
    card.className = 'h-14 rounded-xl bg-[#121418] border border-white/5 hover:border-rose-500/50 active:scale-95 transition flex flex-col items-center justify-center';
    card.onclick = () => speak(char);
    card.innerHTML = `<span class="text-xl font-bold jp">${char}</span>` +
      (showRomaji ? `<span class="text-[10px] text-gray-400 mt-0.5">${item[0]}</span>` : '');
    grid.appendChild(card);
  });
}

function getValidPool(filter) {
  const pool = [];
  KANA.forEach(item => {
    if (!item[0]) return;
    if (filter === 'all' || filter === 'hira') pool.push({ r: item[0], c: item[1], t: 'Hiragana' });
    if (filter === 'all' || filter === 'kata') pool.push({ r: item[0], c: item[2], t: 'Katakana' });
  });
  return pool;
}

function nextFlash() {
  const filter = document.getElementById('flash-filter').value;
  const pool = getValidPool(filter);
  fcItem = pool[Math.floor(Math.random() * pool.length)];
  fcFlipped = false;
  document.getElementById('flash-badge').textContent = fcItem.t;
  document.getElementById('fc-front').textContent = fcItem.c;
  document.getElementById('fc-romaji').textContent = fcItem.r;
  document.getElementById('fc-tip').textContent = `Pelafalan romaji: "${fcItem.r}"`;
  document.getElementById('fc-front').classList.remove('hidden');
  document.getElementById('fc-back').classList.add('hidden');
}

function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById('fc-front').classList.toggle('hidden', fcFlipped);
  document.getElementById('fc-back').classList.toggle('hidden', !fcFlipped);
  if (fcFlipped) speak(fcItem.c);
}

function speakCurrent() { speak(fcItem.c); }

function nextQuiz() {
  const pool = getValidPool('all');
  const target = pool[Math.floor(Math.random() * pool.length)];
  qAnswer = target.r;
  document.getElementById('q-char').textContent = target.c;
  document.getElementById('q-label').textContent = `Huruf ${target.t} apakah ini?`;
  document.getElementById('q-feedback').textContent = '';

  const choices = new Set([target.r]);
  while (choices.size < 4) {
    choices.add(pool[Math.floor(Math.random() * pool.length)].r);
  }
  const shuffled = Array.from(choices).sort(() => Math.random() - 0.5);
  const box = document.getElementById('q-options');
  box.innerHTML = '';
  shuffled.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'py-3.5 rounded-xl bg-[#181b21] border border-white/10 text-sm font-bold hover:border-rose-500/50 transition';
    btn.textContent = opt;
    btn.onclick = () => checkQuiz(opt, target.c);
    box.appendChild(btn);
  });
}

function checkQuiz(picked, char) {
  const fb = document.getElementById('q-feedback');
  if (picked === qAnswer) {
    score += 10; streak++;
    fb.className = 'h-5 text-xs font-semibold text-emerald-400';
    fb.textContent = `Benar! "${char}" dibaca ${qAnswer}`;
    speak(char);
  } else {
    streak = 0;
    fb.className = 'h-5 text-xs font-semibold text-rose-400';
    fb.textContent = `Salah, jawaban benar: ${qAnswer}`;
  }
  document.getElementById('q-score').textContent = score;
  document.getElementById('q-streak').textContent = `${streak} 🔥`;
  setTimeout(nextQuiz, 900);
}

renderTable();
</script>
</body>
</html>
